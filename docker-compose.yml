services:
  postgres:
    image: postgres:17-alpine
    container_name: velora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: velora
      POSTGRES_USER: velora
      POSTGRES_PASSWORD: velora
    ports:
      - "5432:5432"
    volumes:
      - velora-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velora -d velora"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  velora-postgres-data:
